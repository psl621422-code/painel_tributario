        function parseData(dataStr) {
            const [dia, mes, ano] = dataStr.split('/');
            return new Date(ano, mes - 1, dia);
        }

        function renderizarNoticias() {
            const feed = document.getElementById('feed-noticias');
            const busca = document.getElementById('barra-busca').value.toLowerCase();
            const filtroTribunal = document.getElementById('filtro-tribunal').value;
            const filtroVeiculo = document.getElementById('filtro-veiculo').value;
            
            const dataInicioInput = document.getElementById('data-inicio').value;
            const dataFimInput = document.getElementById('data-fim').value;
            const dataInicio = dataInicioInput ? new Date(dataInicioInput) : null;
            const dataFim = dataFimInput ? new Date(dataFimInput) : null;

            if(dataFim) dataFim.setHours(23,59,59);

            feed.innerHTML = '';
            
            const filtradas = noticias.filter(n => {
                const matchTexto = n.titulo.toLowerCase().includes(busca) || n.tags.some(t => t.toLowerCase().includes(busca));
                const matchTribunal = filtroTribunal === 'Todos' || n.tribunal.includes(filtroTribunal) || (filtroTribunal === 'Judiciário' && (n.tribunal === 'STJ' || n.tribunal === 'STF' || n.tribunal === 'Judiciário'));
                const matchVeiculo = filtroVeiculo === 'Todos' || n.veiculo === filtroVeiculo || (filtroVeiculo === 'Outros' && n.veiculo === 'Outros');
                
                const dataNoticia = parseData(n.data);
                const matchData = (!dataInicio || dataNoticia >= dataInicio) && (!dataFim || dataNoticia <= dataFim);

                return matchTexto && matchTribunal && matchVeiculo && matchData;
            });

            if (filtradas.length === 0) {
                feed.innerHTML = '<p style="text-align:center; padding:40px; color:#64748b; font-size:1.1rem;">📭 Nenhuma notícia encontrada com os filtros selecionados.</p>';
                return;
            }

            filtradas.forEach(n => {
                const temPDF = n.pdf && n.pdf.length > 0;
                const pdfLink = temPDF ? n.pdf : "javascript:void(0)";
                const pdfClass = temPDF ? "btn-pdf" : "btn-pdf btn-disabled";
                const pdfTarget = temPDF ? 'target="_blank"' : 'onclick="alert(\'PDF indisponível.\')"';
                const pdfText = temPDF ? "📄 Ver PDF" : "🚫 PDF Indisponível";

                let badges = `<span class="badge-tribunal">${n.tribunal}</span>`;
                if(n.veiculo) {
                    badges += `<span class="badge-veiculo">${n.veiculo}</span>`;
                }

                feed.innerHTML += `
                    <div class="card">
                        <div class="card-header-row">
                            <div class="badge-group">${badges}</div>
                            <span class="data-news">📅 ${n.data}</span>
                        </div>
                        <h2 class="card-title">${n.titulo}</h2>
                        <div style="margin-bottom:10px;">
                            ${n.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <p class="resumo-texto">${n.resumo}</p>
                        <div class="impacto-box">
                            <strong style="color:var(--brand-navy); display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px;">⚡ Impacto Estratégico</strong>
                            <span style="color:var(--brand-copper); font-size:0.9rem; font-weight:600;">${n.impacto}</span>
                        </div>
                        <div class="actions">
                            <a href="${n.link}" target="_blank" class="btn btn-source">🔗 Ler na Fonte</a>
                            <a href="${pdfLink}" ${pdfTarget} class="btn ${pdfClass}">${pdfText}</a>
                        </div>
                    </div>
                `;
            });
        }

        function limparFiltros() {
            document.getElementById('filtro-tribunal').value = 'Todos';
            document.getElementById('filtro-veiculo').value = 'Todos';
            document.getElementById('barra-busca').value = '';
            document.getElementById('data-inicio').value = '';
            document.getElementById('data-fim').value = '';
            renderizarNoticias();
        }

        renderizarNoticias();
    </script>
